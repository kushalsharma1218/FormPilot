<!doctype html>
<html lang="en">
  <head>

    <title>Verify Code</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; background: #f7f7fb; }

    </style>
  </head>
  <body>
    <div class="card">
      <h1>Enter Verification Code</h1>
      <div>
        <input maxlength="1" aria-label="code-1" />
        <input maxlength="1" aria-label="code-2" />
        <input maxlength="1" aria-label="code-3" />
        <input maxlength="1" aria-label="code-4" />
        <input maxlength="1" aria-label="code-5" />
        <input maxlength="1" aria-label="code-6" />
      </div>
    </div>
  </body>
</html>
