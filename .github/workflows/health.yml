name: health

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # One command, and it fails the build on any regression against
      # tests/fixtures/quality-baseline.json — not against a fixed threshold, so
      # matching quality cannot quietly erode toward the line.
      - name: Health check
        run: npm run health

      - name: Backend tests
        working-directory: backend
        run: npm ci && npm test

      # Machine-readable snapshot, so a run can be diffed against the last one.
      - name: Publish metrics
        if: always()
        run: npm run health -- --json > health.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-metrics
          path: health.json
